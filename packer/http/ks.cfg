#version=RHEL9
install
lang en_US.UTF-8
keyboard us

network --bootproto=dhcp --device=eth0 --onboot=on --ipv6=auto

rootpw --plaintext rootpassword

# Create 'packer' user with necessary privileges
user --name=packer --password=packer --groups=wheel,adm --shell=/bin/bash

# Create 'rke2' user with necessary privileges
user --name=rke2 --password=Rancher363502 --groups=wheel,adm --shell=/bin/bash

firewall --enabled --service=ssh

selinux --enforcing

timezone America/New_York --isUtc

bootloader --location=mbr

clearpart --all --initlabel
autopart

%packages
@core
openssh-server
cloud-init
%end

%post --interpreter=/bin/bash
# Enable SSH service
systemctl enable sshd
systemctl start sshd

# Configure sudoers for 'packer' user
echo "packer ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers.d/packer
chmod 440 /etc/sudoers.d/packer

# Configure sudoers for 'rke2' user
echo "rke2 ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers.d/rke2
chmod 440 /etc/sudoers.d/rke2

# Create directory for QEMU secrets
mkdir -p /etc/qemu

# Mount the floppy drive
mkdir -p /mnt/floppy
mount /dev/fd0 /mnt/floppy

# Copy VNC password file from floppy to /etc/qemu
cp /mnt/floppy/vncpass.txt /etc/qemu/vncpass.txt

# Unmount the floppy drive
umount /mnt/floppy

# Configure SSH to allow password authentication
sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
systemctl restart sshd
%end
