- name: Check if private key exists
  stat:
    path: files/tmp/cilium-ca-certificate.key
  register: ca_key_stat
  delegate_to: localhost 

- name: Generate private key for Cilium
  community.crypto.openssl_privatekey:
    path: files/tmp/cilium-ca-certificate.key
  delegate_to: localhost
  when: not ca_key_stat.stat.exists

- name: Check if CA file exists
  stat:
    path: files/tmp/cilium-ca-certificate.pem
  register: ca_file_stat
  delegate_to: localhost

- name: Create certificate signing request (CSR) for CA certificate
  community.crypto.openssl_csr_pipe:
    privatekey_path: files/tmp/cilium-ca-certificate.key
    common_name: "{{ cluster_ca_name }}"
    use_common_name_for_san: false  
    basic_constraints:
      - 'CA:TRUE'
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
    key_usage_critical: true
  register: ca_csr
  delegate_to: localhost
  when: not ca_file_stat.stat.exists

- name: Create self-signed CA certificate from CSR
  community.crypto.x509_certificate:
    path: files/tmp/cilium-ca-certificate.pem
    csr_content: "{{ ca_csr.csr }}"
    privatekey_path: files/tmp/cilium-ca-certificate.key
    provider: selfsigned
  delegate_to: localhost
  when: not ca_file_stat.stat.exists    

- name: Set cilium_ca and cilium_ca_key variables content
  set_fact:
    cilium_ca: "{{ (lookup('file', 'files/tmp/cilium-ca-certificate.pem') + '\n') | b64encode }}" 
    cilium_ca_key: "{{ (lookup('file', 'files/tmp/cilium-ca-certificate.key') + '\n') | b64encode }}"

- name: Create Cilium Helm values file from template
  delegate_to: localhost
  template:
    src: "{{ playbook_dir }}/../templates/cilium/cilium-values.yaml.j2"
    dest: "{{ playbook_dir }}/../files/tmp/{{ rke2_cluster_name }}-cilium-values.yaml"
  vars:
    # certs must be base64 encoded
    ca_cert: "{{ lookup('file', '{{ playbook_dir }}/../files/tmp/ca/ca.crt') | b64encode }}"
    ca_key: "{{ lookup('file', '{{ playbook_dir }}/../files/tmp/ca/ca.key') | b64encode }}"

- name: Install Helm Charts
  delegate_to: localhost
  vars:
    KUBECONFIG: "{{ playbook_dir }}/../files/tmp/{{ rke2_cluster_name }}-kubeconfig"
  block:
  - name: Install Cilium via Helm
    kubernetes.core.helm:
      name: cilium
      chart_ref: cilium
      chart_repo_url: https://helm.cilium.io
      chart_version: "{{ cilium_cilium_version }}"
      release_namespace: kube-system
      create_namespace: false
      state: present
      kubeconfig: "{{ playbook_dir }}/../files/tmp/{{ rke2_cluster_name }}-kubeconfig"
      validate_certs: false
      release_values: "{{ playbook_dir }}/../files/tmp/{{ rke2_cluster_name }}-cilium-values.yaml"

