- name: Disable swap
  ansible.builtin.command: "swapoff -a"
  become: true
  notify: Reboot if needed

- name: Remove swap line from /etc/fstab
  become: true
  lineinfile:
    path: /etc/fstab
    regexp: '^.*swap.*$'
    state: absent

- name: Ensure no swap is present in /etc/fstab
  mount:
    name: swap
    state: absent
    fstype: swap

- name: Install SELinux Python bindings
  become: true
  raw: dnf install -y python3-libselinux

- name: Set SELinux to permissive mode
  become: true
  raw: setenforce 0

- name: Make SELinux permissive mode persistent
  become: true
  raw: sed -i 's/^SELINUX=.*/SELINUX=permissive/' /etc/selinux/config

- name: setenforce 0
  become: true
  ansible.builtin.shell:
    cmd: "setenforce 0"

- name: Update sysconfig selinux
  become: true
  ansible.builtin.shell:
    cmd: "sed -i 's/SELINUX=enforcing/SELINUX=permissive/g' /etc/selinux/config"
  # notify: Reboot if needed

# Create kubectl repo
- name: Create kubectl repo
  ansible.builtin.copy:
    content: |
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/v1.30/rpm/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/v1.30/rpm/repodata/repomd.xml.key
      exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni
    dest: /etc/yum.repos.d/kubernetes.repo
  become: true
  when: init_install_kubectl

# Determine if kubectl is installed
- name: Determine if kubectl is installed
  ansible.builtin.command:
    cmd: "which kubectl"
  register: kubectl_installed
  failed_when: false
  changed_when: false

# Install kubectl
- name: Install kubectl
  become: true
  raw: dnf install -y kubectl --disableexcludes=kubernetes
  when: init_install_kubectl and kubectl_installed.rc != 0

# Add alias for kubectl
- name: Create kube directory
  ansible.builtin.file:
    path: /home/{{ init_user_name }}/.kube
    state: directory
    owner: "{{ init_user_name }}"
    group: "{{ init_user_name }}"
    mode: "0755"
  when: init_install_kubectl

- name: Ensure ~/.bashrc.d directory exists
  file:
    path: "{{ ansible_env.HOME }}/.bashrc.d"
    state: directory
    mode: '0755'

- name: Create a Kubernetes alias file in ~/.bashrc.d/
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.bashrc.d/kubernetes_aliases"
    content: |
      alias k=kubectl
    mode: '0644'

# check if k9s is installed
- name: Check if k9s is installed
  ansible.builtin.command:
    cmd: "which k9s"
  register: k9s_installed
  failed_when: false
  changed_when: false

- name: Download k9s RPM
  ansible.builtin.get_url:
    url: "https://github.com/derailed/k9s/releases/download/{{ init_k9s_version }}/k9s_linux_amd64.rpm"
    dest: "/home/{{ init_user_name }}/k9s_linux_amd64.rpm"
  when: init_install_k9s and k9s_installed.rc != 0

# Install k9s
- name: Install k9s
  become: true
  raw: dnf install -y /home/{{ init_user_name }}/k9s_linux_amd64.rpm --nogpgcheck
  when: init_install_k9s and k9s_installed.rc != 0

# Clean up k9s RPM
- name: Clean up k9s RPM
  ansible.builtin.file:
    path: "/home/{{ init_user_name }}/k9s_linux_amd64.rpm"
    state: absent