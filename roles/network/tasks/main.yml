---
- name: Load br_netfilter module
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Load overlay module
  community.general.modprobe:
    name: overlay
    state: present

- name: Enable br_netfilter module
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-iptables
    value: 1
    state: present
    sysctl_set: true
    reload: false

- name: Enable bridge netfilter for IPv6
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-ip6tables
    value: 1
    state: present
    sysctl_set: true
    reload: false

- name: Enable bridge netfilter for IPv4
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-iptables
    value: 1
    state: present
    sysctl_set: true
    reload: false

- name: Enable ip forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: 1
    state: present
    sysctl_set: true
    reload: true

- name: Install firewall Python bindings
  become: true
  raw: dnf install -y python3-firewall

- name: Add TCP ports to firewall
  become: true
  raw: firewall-cmd --permanent --add-port={{ item }}/tcp
  with_items: "{{ network_allowed_tcp_ports }}"

- name: Add UDP ports to firewall
  become: true
  raw: firewall-cmd --permanent --add-port={{ item }}/udp
  with_items: "{{ network_allowed_udp_ports }}"

- name: Enable masquerade
  become: true
  raw: firewall-cmd --permanent --add-masquerade

- name: Enable HTTP service
  become: true
  raw: firewall-cmd --permanent --add-service=http

- name: Enable HTTPS service
  become: true
  raw: firewall-cmd --permanent --add-service=https

- name: Remove ICMP Block for echo-request
  become: true
  raw: firewall-cmd --permanent --remove-icmp-block=echo-request

- name: Remove ICMP Block for echo-reply
  become: true
  raw: firewall-cmd --permanent --remove-icmp-block=echo-reply

- name: Reload firewall
  become: true
  raw: firewall-cmd --reload

- name: Create /etc/NetworkManager/conf.d/rke2-canal.conf
  ansible.builtin.copy:
    content: |
      [keyfile]
      unmanaged-devices=interface-name:cali*;interface-name:tunl*
    dest: /etc/NetworkManager/conf.d/rke2-canal.conf
    owner: root
    group: root
    mode: "0644"

- name: Create /etc/sysconfig/network-scripts/ifcfg-eth0
  when: network_set_static
  ansible.builtin.copy:
    content: |
      DEVICE=eth0
      BOOTPROTO=static
      ONBOOT=yes
      IPADDR={{ network_static_ip }}
      PREFIX={{ network_static_prefix }}
      GATEWAY={{ network_static_gateway }}
      DNS1={{ network_static_dns1 }}
      DNS2={{ network_static_dns2 }}
    dest: /etc/sysconfig/network-scripts/ifcfg-eth0
    owner: root
    group: root
    mode: "0644"

- name: Restart network
  ansible.builtin.service:
    name: NetworkManager
    state: restarted

