- name: Create Cilium IPPool Manifest
  delegate_to: localhost
  template:
    src: "{{ playbook_dir }}/../templates/cilium/ippool.yaml.j2"
    # dest: "{{ playbook_dir }}/files/tmp/{{ rke2_cluster_name }}-metallb-config.yaml"
    dest: "{{ playbook_dir }}/../files/tmp/{{ rke2_cluster_name }}-cilium-ippool.yaml"

# print out the kubeconfig path
- debug:
    msg: "{{ playbook_dir }}/../files/tmp/{{ rke2_cluster_name }}-kubeconfig"

- name: Install Helm Charts
  delegate_to: localhost
  vars:
    KUBECONFIG: "{{ playbook_dir }}/../files/tmp/{{ rke2_cluster_name }}-kubeconfig"
  block:
  - name: Install Prometheus Operator CRDs
    kubernetes.core.helm:
      name: prometheus-operator-crds
      chart_ref: prometheus-operator-crds
      chart_repo_url: https://prometheus-community.github.io/helm-charts
      chart_version: "{{ rke2_prometheus_operator_version }}"
      release_namespace: kube-system
      # skip_crds: true
      # values:
      #   prometheusOperator.createCustomResource: false  # Skip CRD creation
      create_namespace: true
      state: present
      kubeconfig: "{{ playbook_dir }}/../files/tmp/{{ rke2_cluster_name }}-kubeconfig"
      validate_certs: false
