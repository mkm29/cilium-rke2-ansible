# Install the Kubernetes Gateway API CRDs
# using kubectl: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml
- name: Install Kubernetes Gateway API CRDs
  delegate_to: localhost
  raw: >
    curl -L https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml |
    KUBECONFIG="{{ playbook_dir }}/../files/tmp/{{ rke2_cluster_name }}-kubeconfig" kubectl apply -f -

